name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SAM_CLI_TELEMETRY: 0
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
    # Uncomment the following lines to enable web tests and build when applicable
    #   - name: Web tests
    #     run: npm run web:test
    #   - name: Web build
    #     run: npm run web:build
      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
      - name: Validate SAM template
        run: sam validate --region us-east-1 -t infra/template.yaml
      - name: Build SAM app
        run: npm run build
