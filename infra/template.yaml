AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sentinel - Event-Driven Incident & Reliability Platform

Parameters:
  Stage:
    Type: String
    Default: prod
  CorsAllowOrigin:
    Type: String
    Default: '*'
  AlarmEmail:
    Type: String
    Default: ''
  IncidentNotificationEmail:
    Type: String
    Default: ''
  SlackWorkspaceId:
    Type: String
    Default: ''
  SlackChannelId:
    Type: String
    Default: ''
  IngestRequiresAuth:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  IngestApiKey:
    Type: String
    Default: ''
  ApiLogRetentionDays:
    Type: Number
    Default: 30
  ApiThrottleBurstLimit:
    Type: Number
    Default: 100
  ApiThrottleRateLimit:
    Type: Number
    Default: 50
  LogRetentionDays:
    Type: Number
    Default: 30
  CognitoUserPoolId:
    Type: String
    Default: ''
  CognitoClientId:
    Type: String
    Default: ''
  GitSha:
    Type: String
    Default: ''
  AiEnabled:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  AiProvider:
    Type: String
    Default: 'mock'
  AiModel:
    Type: String
    Default: 'gpt-4o-mini'
  AiTimeoutMs:
    Type: Number
    Default: 4000
  AiMaxRetries:
    Type: Number
    Default: 2
  AiMinEventCountForAnalysis:
    Type: Number
    Default: 1
  AiReanalyzeOnIncidentUpdate:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  OpenAiApiKey:
    Type: String
    Default: ''
    NoEcho: true

Conditions:
  HasSlack: !And
    - !Not [!Equals [!Ref SlackWorkspaceId, '']]
    - !Not [!Equals [!Ref SlackChannelId, '']]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]
  HasNotificationEmail: !Not [!Equals [!Ref IncidentNotificationEmail, '']]
  HasAlarmTarget: !Or [!Condition HasSlack, !Condition HasAlarmEmail]
  IsProd: !Equals [!Ref Stage, 'prod']
  HasCognito: !Not [!Equals [!Ref CognitoUserPoolId, '']]
  IngestAuthEnabled: !And
    - !Condition HasCognito
    - !Equals [!Ref IngestRequiresAuth, 'true']

Rules:
  RequireCognitoInProd:
    Assertions:
      - Assert: !Or
          - !Not [!Equals [!Ref Stage, 'prod']]
          - !Not [!Equals [!Ref CognitoUserPoolId, '']]
        AssertDescription: CognitoUserPoolId must be set for prod deployments.

Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 256
    Timeout: 10
    Tracing: Active
    Environment:
      Variables:
        STAGE: !Ref Stage
        DEFAULT_ENV: !Ref Stage
        EVENT_BUS_NAME: !Ref SentinelBus
        EVENTS_QUEUE_URL: !Ref EventsQueue
        NOTIFICATIONS_QUEUE_URL: !Ref NotificationsQueue
        GIT_SHA: !Ref GitSha
        INCIDENTS_TABLE_NAME: !Ref IncidentsTable
        EVENT_STATE_TABLE_NAME: !Ref EventStateTable
        OUTBOX_TABLE_NAME: !Ref OutboxTable
        INCIDENT_EVENTS_TABLE_NAME: !Ref IncidentEventsTable
        IDEMPOTENCY_TABLE_NAME: !Ref IdempotencyTable
        NOTIFICATION_TARGETS_TABLE_NAME: !Ref NotificationTargetsTable
        METRICS_TABLE_NAME: !Ref MetricsTable
        RULES_TABLE_NAME: !Ref RulesTable
        DEDUP_WINDOW_MS: '300000'
        SEVERITY_WINDOW_MS: '300000'
        PROCESSING_TIMEOUT_SECONDS: '120'
        IDEMPOTENCY_TTL_SECONDS: '86400'
        EVENT_STATE_TTL_SECONDS: '604800'
        OUTBOX_TTL_SECONDS: '604800'
        INCIDENT_EVENTS_TTL_SECONDS: '604800'
        AI_ENABLED: !Ref AiEnabled
        AI_PROVIDER: !Ref AiProvider
        AI_MODEL: !Ref AiModel
        AI_TIMEOUT_MS: !Ref AiTimeoutMs
        AI_MAX_RETRIES: !Ref AiMaxRetries
        AI_MIN_EVENT_COUNT_FOR_ANALYSIS: !Ref AiMinEventCountForAnalysis
        AI_REANALYZE_ON_INCIDENT_UPDATE: !Ref AiReanalyzeOnIncidentUpdate

Resources:
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/sentinel-${Stage}-access
      RetentionInDays: !Ref ApiLogRetentionDays

  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/sentinel-${Stage}-ingest
      RetentionInDays: !Ref LogRetentionDays

  IncidentEngineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/sentinel-${Stage}-incident-engine
      RetentionInDays: !Ref LogRetentionDays

  OutboxPublisherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/sentinel-${Stage}-outbox-publisher
      RetentionInDays: !Ref LogRetentionDays

  NotificationWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/sentinel-${Stage}-notification-worker
      RetentionInDays: !Ref LogRetentionDays

  AiAnalysisLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/sentinel-${Stage}-ai-analysis
      RetentionInDays: !Ref LogRetentionDays

  AuthAuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/sentinel-${Stage}-auth-authorizer
      RetentionInDays: !Ref LogRetentionDays

  IncidentApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/sentinel-${Stage}-incident-api
      RetentionInDays: !Ref LogRetentionDays

  SentinelApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'authorization,content-type,x-correlation-id,x-tenant-id,x-request-id,x-api-key,idempotency-key'"
        AllowOrigin: !Sub "'${CorsAllowOrigin}'"
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","caller":"$context.identity.caller","user":"$context.identity.user","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationError":"$context.integrationErrorMessage"}
      MethodSettings:
        - LoggingLevel: INFO
          DataTraceEnabled: false
          MetricsEnabled: true
          ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: !Ref ApiThrottleBurstLimit
          ThrottlingRateLimit: !Ref ApiThrottleRateLimit
      Auth:
        DefaultAuthorizer: SentinelJwtAuthorizer
        Authorizers:
          SentinelJwtAuthorizer:
            FunctionArn: !GetAtt AuthAuthorizerFunction.Arn
            FunctionPayloadType: REQUEST
            Identity:
              Headers:
                - Authorization
                - X-Tenant-Id
              ReauthorizeEvery: 300

  SentinelBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub sentinel-${Stage}-bus

  EventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub sentinel-${Stage}-events-queue
      VisibilityTimeout: 30
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EventsDlq.Arn
        maxReceiveCount: 3

  EventsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub sentinel-${Stage}-events-dlq
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  NotificationsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub sentinel-${Stage}-notifications-queue
      VisibilityTimeout: 30
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationsDlq.Arn
        maxReceiveCount: 3

  NotificationsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub sentinel-${Stage}-notifications-dlq
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  AiAnalysisQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub sentinel-${Stage}-ai-analysis-queue
      VisibilityTimeout: 30
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AiAnalysisDlq.Arn
        maxReceiveCount: 3

  AiAnalysisDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub sentinel-${Stage}-ai-analysis-dlq
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  EventsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref EventsQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgeToSend
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt EventsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt IngestToQueueRule.Arn

  NotificationsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref NotificationsQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgeToSend
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt NotificationsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt IncidentChangedRule.Arn

  AiAnalysisQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref AiAnalysisQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgeToSend
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt AiAnalysisQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt IncidentAnalysisRequestedRule.Arn

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub sentinel-${Stage}-alarms

  NotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub sentinel-${Stage}-notifications

  AlarmEmailSubscription:
    Condition: HasAlarmEmail
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  NotificationsEmailSubscription:
    Condition: HasNotificationEmail
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref NotificationsTopic
      Protocol: email
      Endpoint: !Ref IncidentNotificationEmail

  ChatbotRole:
    Condition: HasSlack
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub sentinel-${Stage}-chatbot
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: chatbot.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSChatbotServiceRolePolicy

  SlackAlerts:
    Condition: HasSlack
    Type: AWS::Chatbot::SlackChannelConfiguration
    Properties:
      ConfigurationName: !Sub sentinel-${Stage}-alerts
      SlackWorkspaceId: !Ref SlackWorkspaceId
      SlackChannelId: !Ref SlackChannelId
      IamRoleArn: !GetAtt ChatbotRole.Arn
      SnsTopicArns:
        - !Ref AlarmTopic
      LoggingLevel: ERROR

  SentinelWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub sentinel-${Stage}-web-acl
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub sentinel-${Stage}-web-acl
        SampledRequestsEnabled: true
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub sentinel-${Stage}-waf-common
            SampledRequestsEnabled: true
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub sentinel-${Stage}-waf-bad-inputs
            SampledRequestsEnabled: true
        - Name: AWSManagedRulesSQLiRuleSet
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesSQLiRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: !Sub sentinel-${Stage}-waf-sqli
            SampledRequestsEnabled: true

  SentinelWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Sub arn:aws:apigateway:${AWS::Region}::/restapis/${SentinelApi}/stages/${Stage}
      WebACLArn: !GetAtt SentinelWebAcl.Arn

  EventsDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sentinel-${Stage}-events-dlq-visible
      AlarmDescription: Events DLQ has messages ready for inspection.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EventsDlq.QueueName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: !If [HasAlarmTarget, true, false]
      AlarmActions: !If [HasAlarmTarget, [!Ref AlarmTopic], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmTarget, [!Ref AlarmTopic], !Ref AWS::NoValue]

  EventsQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sentinel-${Stage}-events-queue-age
      AlarmDescription: Events queue oldest message age is high.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EventsQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: !If [HasAlarmTarget, true, false]
      AlarmActions: !If [HasAlarmTarget, [!Ref AlarmTopic], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmTarget, [!Ref AlarmTopic], !Ref AWS::NoValue]

  NotificationsQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sentinel-${Stage}-notifications-queue-age
      AlarmDescription: Notifications queue oldest message age is high.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NotificationsQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: !If [HasAlarmTarget, true, false]
      AlarmActions: !If [HasAlarmTarget, [!Ref AlarmTopic], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmTarget, [!Ref AlarmTopic], !Ref AWS::NoValue]

  IngestErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sentinel-${Stage}-ingest-errors
      AlarmDescription: Ingest lambda errors detected.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IngestFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: !If [HasAlarmTarget, true, false]
      AlarmActions: !If [HasAlarmTarget, [!Ref AlarmTopic], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmTarget, [!Ref AlarmTopic], !Ref AWS::NoValue]

  IncidentEngineErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sentinel-${Stage}-incident-engine-errors
      AlarmDescription: Incident engine lambda errors detected.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IncidentEngineFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: !If [HasAlarmTarget, true, false]
      AlarmActions: !If [HasAlarmTarget, [!Ref AlarmTopic], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmTarget, [!Ref AlarmTopic], !Ref AWS::NoValue]

  OutboxPublisherErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sentinel-${Stage}-outbox-publisher-errors
      AlarmDescription: Outbox publisher lambda errors detected.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref OutboxPublisherFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: !If [HasAlarmTarget, true, false]
      AlarmActions: !If [HasAlarmTarget, [!Ref AlarmTopic], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmTarget, [!Ref AlarmTopic], !Ref AWS::NoValue]

  NotificationWorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sentinel-${Stage}-notification-worker-errors
      AlarmDescription: Notification worker lambda errors detected.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref NotificationWorkerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: !If [HasAlarmTarget, true, false]
      AlarmActions: !If [HasAlarmTarget, [!Ref AlarmTopic], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmTarget, [!Ref AlarmTopic], !Ref AWS::NoValue]

  IncidentApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sentinel-${Stage}-incident-api-errors
      AlarmDescription: Incident API lambda errors detected.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IncidentApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: !If [HasAlarmTarget, true, false]
      AlarmActions: !If [HasAlarmTarget, [!Ref AlarmTopic], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmTarget, [!Ref AlarmTopic], !Ref AWS::NoValue]

  IngestToQueueRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref SentinelBus
      EventPattern:
        source:
          - sentinel.ingest
      Targets:
        - Arn: !GetAtt EventsQueue.Arn
          Id: EventsQueueTarget

  IncidentChangedRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref SentinelBus
      EventPattern:
        source:
          - sentinel.incident
        detail-type:
          - IncidentChanged
      Targets:
        - Arn: !GetAtt NotificationsQueue.Arn
          Id: NotificationsQueueTarget

  IncidentAnalysisRequestedRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref SentinelBus
      EventPattern:
        source:
          - sentinel.ai
        detail-type:
          - IncidentAnalysisRequested
      Targets:
        - Arn: !GetAtt AiAnalysisQueue.Arn
          Id: AiAnalysisQueueTarget

  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub sentinel-${Stage}-incidents
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: status-index
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  EventStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub sentinel-${Stage}-event-state
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  IncidentEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub sentinel-${Stage}-incident-events
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  NotificationTargetsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub sentinel-${Stage}-notification-targets
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  MetricsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub sentinel-${Stage}-metrics
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub sentinel-${Stage}-idempotency
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  OutboxTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub sentinel-${Stage}-outbox
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - AttributeName: outboxId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: outboxId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  RulesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub sentinel-${Stage}-rules
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      DeletionProtectionEnabled: !If [IsProd, true, false]
      AttributeDefinitions:
        - AttributeName: ruleId
          AttributeType: S
      KeySchema:
        - AttributeName: ruleId
          KeyType: HASH

  AuthAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sentinel-${Stage}-auth-authorizer
      CodeUri: ..
      Handler: handler.handler
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          INGEST_AUTH_REQUIRED: !If [IngestAuthEnabled, 'true', 'false']
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - services/auth-authorizer/src/handler.ts
        Minify: false
        Target: node20
        Sourcemap: true

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sentinel-${Stage}-ingest
      CodeUri: ..
      Handler: handler.handler
      Environment:
        Variables:
          INGEST_AUTH_REQUIRED: !If [IngestAuthEnabled, 'true', 'false']
          INGEST_API_KEY: !Ref IngestApiKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IdempotencyTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MetricsTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref SentinelBus
      Events:
        IngestApi:
          Type: Api
          Properties:
            RestApiId: !Ref SentinelApi
            Path: /v1/events
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - services/ingest-api/src/handler.ts
        Minify: false
        Target: node20
        Sourcemap: true

  IncidentEngineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sentinel-${Stage}-incident-engine
      CodeUri: ..
      Handler: handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventStateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentEventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OutboxTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MetricsTable
        - DynamoDBReadPolicy:
            TableName: !Ref RulesTable
      Events:
        EventsQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt EventsQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - services/incident-engine/src/handler.ts
        Minify: false
        Target: node20
        Sourcemap: true

  OutboxPublisherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sentinel-${Stage}-outbox-publisher
      CodeUri: ..
      Handler: handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OutboxTable
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref SentinelBus
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - services/outbox-publisher/src/handler.ts
        Minify: false
        Target: node20
        Sourcemap: true

  NotificationWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sentinel-${Stage}-notification-worker
      CodeUri: ..
      Handler: handler.handler
      Environment:
        Variables:
          DEFAULT_NOTIFICATION_TOPIC_ARN: !Ref NotificationsTopic
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref IncidentsTable
        - DynamoDBReadPolicy:
            TableName: !Ref NotificationTargetsTable
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:sentinel-${Stage}-*
      Events:
        NotificationsQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt NotificationsQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - services/notification-worker/src/handler.ts
        Minify: false
        Target: node20
        Sourcemap: true

  AiAnalysisFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sentinel-${Stage}-ai-analysis
      CodeUri: ..
      Handler: handler.handler
      Environment:
        Variables:
          OPENAI_API_KEY: !Ref OpenAiApiKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
        - DynamoDBReadPolicy:
            TableName: !Ref IncidentEventsTable
      Events:
        AiAnalysisQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt AiAnalysisQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - services/ai-analysis/src/handler.ts
        Minify: false
        Target: node20
        Sourcemap: true

  IncidentApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sentinel-${Stage}-incident-api
      CodeUri: ..
      Handler: handler.handler
      Environment:
        Variables:
          AUTH_REQUIRED: !If [HasCognito, 'true', 'false']
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncidentsTable
        - DynamoDBReadPolicy:
            TableName: !Ref IncidentEventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OutboxTable
        - DynamoDBReadPolicy:
            TableName: !Ref MetricsTable
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref SentinelApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE
        ServiceMetrics:
          Type: Api
          Properties:
            RestApiId: !Ref SentinelApi
            Path: /metrics
            Method: GET
            Auth:
              Authorizer: NONE
        ListIncidents:
          Type: Api
          Properties:
            RestApiId: !Ref SentinelApi
            Path: /v1/incidents
            Method: GET
        GetIncident:
          Type: Api
          Properties:
            RestApiId: !Ref SentinelApi
            Path: /v1/incidents/{incidentId}
            Method: GET
        GetIncidentEvents:
          Type: Api
          Properties:
            RestApiId: !Ref SentinelApi
            Path: /v1/incidents/{incidentId}/events
            Method: GET
        AckIncident:
          Type: Api
          Properties:
            RestApiId: !Ref SentinelApi
            Path: /v1/incidents/{incidentId}/ack
            Method: POST
        ResolveIncident:
          Type: Api
          Properties:
            RestApiId: !Ref SentinelApi
            Path: /v1/incidents/{incidentId}/resolve
            Method: POST
        GetMetrics:
          Type: Api
          Properties:
            RestApiId: !Ref SentinelApi
            Path: /v1/metrics
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - services/incident-api/src/handler.ts
        Minify: false
        Target: node20
        Sourcemap: true

  SentinelDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub sentinel-${Stage}-dashboard
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "width": 24,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "Sentinel", "events_ingested", "service", "ingest-api" ],
                  [ ".", "events_deduplicated", "service", "incident-engine" ],
                  [ ".", "incidents_opened", "service", "incident-engine" ],
                  [ ".", "incidents_escalated", "service", "incident-engine" ]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "title": "Sentinel Core Metrics"
              }
            },
            {
              "type": "metric",
              "width": 24,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "Sentinel", "processing_latency_ms", "service", "incident-engine" ]
                ],
                "period": 300,
                "stat": "Average",
                "region": "${AWS::Region}",
                "title": "Processing Latency"
              }
            }
          ]
        }

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${SentinelApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  AlarmTopicArn:
    Description: SNS topic for operational alerts
    Value: !Ref AlarmTopic
  WebAclArn:
    Description: WAF Web ACL protecting the API
    Value: !GetAtt SentinelWebAcl.Arn
  EventsQueueUrl:
    Value: !Ref EventsQueue
  EventsDlqUrl:
    Value: !Ref EventsDlq
  NotificationsQueueUrl:
    Value: !Ref NotificationsQueue
  NotificationsDlqUrl:
    Value: !Ref NotificationsDlq
  AiAnalysisQueueUrl:
    Value: !Ref AiAnalysisQueue
  AiAnalysisDlqUrl:
    Value: !Ref AiAnalysisDlq
  NotificationsTopicArn:
    Description: SNS topic for incident notifications
    Value: !Ref NotificationsTopic
  NotificationTargetsTableName:
    Value: !Ref NotificationTargetsTable
  MetricsTableName:
    Value: !Ref MetricsTable
