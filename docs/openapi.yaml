openapi: 3.0.3
info:
  title: Sentinel API
  version: 0.2.0
  description: API definitions for event ingestion, incident management, and service health.
servers:
  - url: https://{apiId}.execute-api.{region}.amazonaws.com/{stage}
    variables:
      apiId:
        default: replace-with-api-id
      region:
        default: us-east-1
      stage:
        default: prod
paths:
  /health:
    get:
      summary: Health check
      description: Lightweight health probe for the service.
      security: []
      responses:
        '200':
          description: Service is healthy
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /metrics:
    get:
      summary: Service metrics
      description: Returns basic service metrics like uptime and version.
      security: []
      responses:
        '200':
          description: Service metrics
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceMetricsResponse'
  /v1/events:
    post:
      summary: Ingest an event
      description: Validates and enqueues an operational event for correlation.
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestEvent'
      responses:
        '200':
          description: Event accepted
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          description: Invalid request
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to publish
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/incidents:
    get:
      summary: List incidents
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/IncidentStatus'
        - in: query
          name: source
          schema:
            type: string
        - in: query
          name: env
          schema:
            type: string
        - in: query
          name: severity
          schema:
            $ref: '#/components/schemas/Severity'
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: nextToken
          schema:
            type: string
      responses:
        '200':
          description: Incident list
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentListResponse'
        '400':
          description: Invalid request
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/incidents/{incidentId}:
    get:
      summary: Get incident by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - in: path
          name: incidentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Incident
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentResponse'
        '401':
          description: Unauthorized
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/incidents/{incidentId}/events:
    get:
      summary: List incident timeline events
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - in: path
          name: incidentId
          required: true
          schema:
            type: string
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: nextToken
          schema:
            type: string
      responses:
        '200':
          description: Incident event list
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentEventListResponse'
        '400':
          description: Invalid request
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/incidents/{incidentId}/ack:
    post:
      summary: Acknowledge incident
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - in: path
          name: incidentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Acknowledged
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentActionResponse'
        '400':
          description: Invalid request
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/incidents/{incidentId}/resolve:
    post:
      summary: Resolve incident
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - in: path
          name: incidentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resolved
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentActionResponse'
        '400':
          description: Invalid request
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/metrics:
    get:
      summary: Get tenant metrics
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      responses:
        '200':
          description: Metrics response
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '401':
          description: Unauthorized
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: Metrics not configured
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      name: X-API-KEY
      in: header
  parameters:
    TenantIdHeader:
      in: header
      name: X-Tenant-Id
      required: true
      schema:
        type: string
      description: Tenant identifier for multi-tenant routing.
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
      description: Optional idempotency key for ingest de-duplication.
  headers:
    XRequestId:
      description: Request identifier for tracing and support.
      schema:
        type: string
  schemas:
    Severity:
      type: string
      enum: [low, medium, high, critical]
    IncidentStatus:
      type: string
      enum: [OPEN, ACKED, RESOLVED]
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
            requestId:
              type: string
    IngestEvent:
      type: object
      required: [eventId, source, type, timestamp, fingerprint, attributes]
      properties:
        eventId:
          type: string
        source:
          type: string
        type:
          type: string
        severityHint:
          $ref: '#/components/schemas/Severity'
        idempotencyKey:
          type: string
        timestamp:
          type: string
          format: date-time
        fingerprint:
          type: string
        attributes:
          type: object
          additionalProperties: true
    IngestResponse:
      type: object
      properties:
        accepted:
          type: boolean
        eventId:
          type: string
        status:
          type: string
        idempotencyKey:
          type: string
        duplicate:
          type: boolean
    Incident:
      type: object
      properties:
        incidentId:
          type: string
        tenantId:
          type: string
        ownerUserId:
          type: string
        status:
          $ref: '#/components/schemas/IncidentStatus'
        source:
          type: string
        fingerprint:
          type: string
        env:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        openedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastEventAt:
          type: string
          format: date-time
        eventCount:
          type: integer
        version:
          type: integer
    IncidentEvent:
      type: object
      properties:
        eventId:
          type: string
        source:
          type: string
        type:
          type: string
        severityHint:
          $ref: '#/components/schemas/Severity'
        timestamp:
          type: string
          format: date-time
        fingerprint:
          type: string
        attributes:
          type: object
          additionalProperties: true
    IncidentListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Incident'
        nextToken:
          type: string
        pageSize:
          type: integer
    IncidentEventListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IncidentEvent'
        nextToken:
          type: string
        pageSize:
          type: integer
    IncidentResponse:
      type: object
      properties:
        incident:
          $ref: '#/components/schemas/Incident'
    IncidentActionResponse:
      type: object
      properties:
        incidentId:
          type: string
        status:
          $ref: '#/components/schemas/IncidentStatus'
        idempotent:
          type: boolean
    MetricsResponse:
      type: object
      properties:
        metrics:
          type: object
          properties:
            ingested:
              type: integer
            deduped:
              type: integer
        updatedAt:
          type: object
          properties:
            ingested:
              type: string
              format: date-time
            deduped:
              type: string
              format: date-time
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        timestamp:
          type: string
          format: date-time
    ServiceMetricsResponse:
      type: object
      properties:
        service:
          type: string
        version:
          type: string
        uptimeSeconds:
          type: integer
        timestamp:
          type: string
          format: date-time
